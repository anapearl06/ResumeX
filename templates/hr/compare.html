<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Compare Candidates &middot; Resumex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <style>
    .compare-layout{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-top:24px}
    @media(max-width:768px){.compare-layout{grid-template-columns:1fr}}
    .pick-cand{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:all .15s}
    .pick-cand:hover{border-color:var(--primary)}
    .pick-cand.selected{border-color:var(--primary);background:rgba(59,130,246,.04)}
    .pick-cand input[type="checkbox"]{accent-color:var(--primary)}
    .comp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
    .vs-title{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:600;margin-bottom:10px}
  </style>
</head>
<body>
  <div class="layout">
    {% include 'hr/sidebar.html' with context %}
    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="page-header">
            <h1>Compare Candidates</h1>
            <p style="color:var(--text-muted);font-size:var(--text-sm);margin-top:4px">Select 2+ candidates to compare side-by-side</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" id="compareBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:16px;height:16px"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" y1="20" x2="12" y2="4"/></svg>
            Compare
            <span class="badge badge-default" id="selCount" style="margin-left:4px">0</span>
          </button>
        </div>
      </div>

      <div class="compare-layout">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Select Candidates</div>
          </div>
          <div id="pickList" style="max-height:65vh;overflow-y:auto"></div>
        </div>

        <div id="compArea">
          <div class="empty" id="compEmpty" style="padding:80px 0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin:0 auto 16px;opacity:.25"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" y1="20" x2="12" y2="4"/></svg>
            <h3>Select at least 2 candidates to begin</h3>
            <p style="margin-top:4px;color:var(--text-muted)">Check the boxes on the left to pick candidates</p>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/static/js/main.js"></script>
  <script>
    let candidates = [];
    let selected = new Set();

    document.getElementById('compareBtn').addEventListener('click', async () => {
      if (selected.size < 2) { toast('Select at least 2 candidates to compare', 'error'); return; }
      document.getElementById('compArea').innerHTML = `
        <div class="card">
          <div style="text-align:center;padding:64px">
            <div class="spinner"></div>
            <div style="margin-top:16px;font-size:var(--text-base);color:var(--text-secondary)">AI is analyzing and comparing candidates...</div>
          </div>
        </div>`;

      try {
        const res = await apiFetch('/api/hr/compare', {
          method: 'POST',
          body: JSON.stringify({ candidate_ids: [...selected] })
        });
        renderComparison(res);
      } catch (e) {
        document.getElementById('compArea').innerHTML = `
          <div class="empty" style="padding:48px 0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:40px;height:40px;margin:0 auto 12px;opacity:.25"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <h3>${esc(e.message)}</h3>
          </div>`;
      }
    });

    function toggleSel(id, el) {
      const cb = el.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      el.classList.toggle('selected', cb.checked);
      if (cb.checked) selected.add(id); else selected.delete(id);
      document.getElementById('selCount').textContent = selected.size;
    }

    function renderComparison(res) {
      const comp = res.comparison || [];
      let html = '';

      if (res.recommendation) {
        html += `
          <div class="comp-card animate-in">
            <div class="vs-title">AI Recommendation</div>
            <div style="font-size:var(--text-base);line-height:1.7;color:var(--text-secondary)">${esc(res.recommendation)}</div>
          </div>`;
      }

      html += `<div class="grid grid-2">`;
      html += comp.map((c, i) => `
        <div class="comp-card animate-in delay-${Math.min(i + 1, 5)}">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-size:var(--text-sm);font-weight:700;color:#fff">${esc((c.name || '?')[0])}</div>
              <strong style="font-size:var(--text-lg)">${esc(c.name)}</strong>
            </div>
            <span class="badge badge-blue" style="font-size:var(--text-lg);padding:4px 12px">${c.score}%</span>
          </div>
          <div style="margin-bottom:16px">
            <div class="vs-title">Strengths</div>
            <div class="tags">${(c.strengths || []).map(s => `<span class="tag tag-have">${esc(s)}</span>`).join('')}</div>
          </div>
          <div style="margin-bottom:16px">
            <div class="vs-title">Weaknesses</div>
            <div class="tags">${(c.weaknesses || []).map(s => `<span class="tag tag-missing">${esc(s)}</span>`).join('')}</div>
          </div>
          <div>
            <div class="vs-title">Best For</div>
            <div style="font-size:var(--text-sm);color:var(--text-secondary);line-height:1.6">${esc(c.best_for || '') || '&mdash;'}</div>
          </div>
        </div>
      `).join('');
      html += `</div>`;

      document.getElementById('compArea').innerHTML = html || '<div class="empty"><h3>No comparison data returned</h3></div>';
    }

    async function loadCandidates() {
      try {
        candidates = await apiFetch('/api/hr/candidates');
      } catch (e) {
        candidates = [];
      }

      if (candidates.length === 0) {
        document.getElementById('pickList').innerHTML = `
          <div class="empty" style="padding:24px 0">
            <p>No candidates uploaded yet</p>
            <a href="/hr/candidates" class="btn btn-ghost btn-sm" style="margin-top:8px">Upload Candidates</a>
          </div>`;
        return;
      }

      document.getElementById('pickList').innerHTML = candidates.map(c => `
        <div class="pick-cand" onclick="toggleSel(${c.id}, this)">
          <input type="checkbox" onclick="event.stopPropagation()"/>
          <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:700;color:#fff;flex-shrink:0">${esc((c.name || '?')[0])}</div>
          <div style="min-width:0">
            <div style="font-weight:600;font-size:var(--text-sm);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</div>
            <div style="font-size:var(--text-xs);color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(c.skills || []).slice(0, 3).join(', ')}${(c.skills || []).length > 3 ? '...' : ''}</div>
          </div>
        </div>
      `).join('');
    }

    loadCandidates();
  </script>
</body>
</html>
