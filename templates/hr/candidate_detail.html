<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Candidate Profile &middot; Resumex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body>
  <div class="layout">
    {% include 'hr/sidebar.html' with context %}
    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="page-header">
            <h1>Candidate Profile</h1>
          </div>
          <a href="/hr/candidates" class="btn btn-ghost btn-sm" style="margin-top:8px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            Back to Candidates
          </a>
        </div>
      </div>

      <div id="profile"></div>
      <div id="detailGrid" class="grid grid-2" style="margin-top:24px"></div>
      <div id="loading" style="text-align:center;padding:48px 0">
        <div class="spinner"></div>
        <div style="margin-top:12px;font-size:var(--text-sm);color:var(--text-muted)">Loading profile...</div>
      </div>
    </main>
  </div>
  <script src="/static/js/main.js"></script>
  <script>
    const cid = {{ cid }};

    async function load() {
      try {
        const c = await apiFetch('/api/hr/candidate/' + cid);
        document.getElementById('loading').style.display = 'none';

        document.getElementById('profile').innerHTML = `
          <div class="card animate-in" style="display:flex;align-items:center;gap:24px;padding:32px">
            <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-size:var(--text-2xl);font-weight:700;color:#fff;flex-shrink:0">${esc((c.name || '?')[0])}</div>
            <div>
              <div style="font-size:var(--text-2xl);font-weight:700;color:var(--text)">${esc(c.name)}</div>
              <div style="display:flex;align-items:center;gap:16px;margin-top:6px;flex-wrap:wrap;font-size:var(--text-sm);color:var(--text-muted)">
                ${c.email ? `<span style="display:inline-flex;align-items:center;gap:4px">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                  ${esc(c.email)}
                </span>` : ''}
                ${c.phone ? `<span style="display:inline-flex;align-items:center;gap:4px">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  ${esc(c.phone)}
                </span>` : ''}
                <span class="badge badge-blue">${c.total_experience_years || 0} years experience</span>
              </div>
            </div>
          </div>`;

        document.getElementById('detailGrid').innerHTML = `
          <div class="card animate-in delay-1">
            <div class="card-header">
              <div class="card-title">Skills</div>
              <span class="badge badge-default">${(c.skills || []).length}</span>
            </div>
            <div class="tags">${(c.skills || []).map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>
          </div>

          <div class="card animate-in delay-2">
            <div class="card-header">
              <div class="card-title">Experience</div>
              <span class="badge badge-default">${(c.experience || []).length}</span>
            </div>
            <div class="timeline">${(c.experience || []).map(e => `
              <div class="timeline-item">
                <div style="font-weight:600;font-size:var(--text-base);color:var(--text)">${esc(e.role)}</div>
                <div style="font-size:var(--text-sm);color:var(--text-muted);margin-top:2px">${esc(e.company)} &middot; ${esc(e.duration)}</div>
                <div style="font-size:var(--text-sm);color:var(--text-secondary);margin-top:6px;line-height:1.6">${esc(e.description)}</div>
              </div>
            `).join('')}</div>
          </div>

          <div class="card animate-in delay-3">
            <div class="card-header">
              <div class="card-title">Projects</div>
              <span class="badge badge-default">${(c.projects || []).length}</span>
            </div>
            ${(c.projects || []).length > 0
              ? (c.projects || []).map(p => `<div class="list-item">${esc(p)}</div>`).join('')
              : '<div style="color:var(--text-muted);font-size:var(--text-sm)">No projects listed</div>'}
          </div>

          <div class="card animate-in delay-4">
            <div class="card-header">
              <div class="card-title">Certifications</div>
              <span class="badge badge-default">${(c.certifications || []).length}</span>
            </div>
            ${(c.certifications || []).length > 0
              ? (c.certifications || []).map(x => `<div class="list-item">
                  <div style="display:flex;align-items:center;gap:8px">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" style="width:16px;height:16px;flex-shrink:0"><path d="M9 12l2 2 4-4"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                    ${esc(x)}
                  </div>
                </div>`).join('')
              : '<div style="color:var(--text-muted);font-size:var(--text-sm)">No certifications listed</div>'}
          </div>
        `;
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('profile').innerHTML = `
          <div class="empty" style="padding:48px 0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:40px;height:40px;margin:0 auto 12px;opacity:.25"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <h3>${esc(e.message)}</h3>
            <a href="/hr/candidates" class="btn btn-ghost" style="margin-top:12px">Back to Candidates</a>
          </div>`;
      }
    }

    load();
  </script>
</body>
</html>
